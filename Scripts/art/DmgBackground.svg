<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363d"/><stop offset="1" stop-color="#15161a"/></linearGradient>
  <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fe0ff"/><stop offset="1" stop-color="#8a5bff"/></linearGradient>
 </defs>
 <rect width="660" height="420" fill="url(#bg)"/>
 <!-- Plates under the icon names: Finder draws the names black in light mode and white in
      dark mode, so they sit on a mid tone that both read on. -->
 <rect x="95" y="262" width="160" height="30" rx="15" fill="#7b808d"/>
 <rect x="405" y="262" width="160" height="30" rx="15" fill="#7b808d"/>
 <!-- Arrow from the app (centre 175,190) to Applications (centre 485,190). -->
 <polygon points="282,178 348,178 348,156 386,190 348,224 348,202 282,202" fill="url(#arrow)"/>
</svg>
